gin:0 0 6px}.creation p{color:var(--muted);margin:0}.footer{border-top:1px solid #ffffff12;padding:24px 0;color:#858b98;font-size:12px;text-align:center}.hidden{display:none!important}.admin-box{background:#111319;border:1px solid #373b47;border-radius:12px;padding:20px;margin-bottom:18px}.admin-box h2{margin:0 0 14px;font-size:19px}.admin-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.admin-tabs button{background:#252832;color:#ddd;border:1px solid #383b46;border-radius:7px;padding:8px 12px}.admin-tabs button.active{background:#39305f;border-color:#7161ce}.admin-list{display:grid;gap:8px;margin-top:15px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#1a1c23;border-radius:8px}.admin-item small{display:block;color:var(--muted)}.notice{padding:10px 12px;border-radius:8px;background:#202a29;color:#a5f0d2;margin:12px 0;font-size:13px}.notice.error{background:#382225;color:#ffb6b6}.article-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.contact-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.contact-card{background:#1d2027;border:1px solid var(--line);padding:16px;border-radius:10px}.contact-card span{display:block;color:var(--muted);font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#20232b;border:1px solid #454957;border-radius:10px;padding:12px 16px;z-index:20;max-width:calc(100% - 40px)}

</h2><p>Logística · Sistemas · Organização empresarial</p></section><section class="side-panel"><h3>Pesquisar artigos</h3><form id="searchForm" class="search-row"><input class="field" id="searchInput" placeholder="O que você procura?" aria-label="Pesquisar artigos"><button class="btn" aria-label="Pesquisar">⌕</button></form></section></aside></div>

<script>
/* CONFIGURAÇÃO: preencha com os dados públicos do seu projeto Supabase. Nunca coloque service_role ou senha neste arquivo. */
const SUPABASE_URL = 'https://knmmuxuitzhzsvtioomk.supabase.co';
const SUPABASE_ANON_KEY = 'COLE_AQUI_SUA_CHAVE_PUBLICA_SUPABASE';
const ADMIN_FUNCTION_URL = SUPABASE_URL + '/functions/v1/site-admin';
const CATEGORIES = ['Logística','Desenvolvimento de Sistemas','Organização Empresarial','Diversidade e Atualidades'];
const DEMO = [
{id:'demo-1',title:'Organização de estoque: muito além de contar produtos',summary:'Como processos bem definidos e informações confiáveis ajudam a transformar a rotina operacional.',content:'Este é um artigo de demonstração. Entre no acesso do autor para publicar seu próprio conteúdo, incluir imagens e escolher uma categoria.\n\nUm estoque organizado não depende apenas de contar itens: depende de padronização, rastreabilidade, disciplina operacional e informação acessível.',category:'Logística',image:'',created_at:'2026-10-08T12:00:00Z'},
{id:'demo-2',title:'Tecnologia aplicada aos desafios do dia a dia',summary:'Ideias para aproximar sistemas, processos e pessoas e resolver problemas reais das empresas.',content:'Este é um artigo de demonstração. Substitua-o por suas próprias ideias e experiências quando configurar o banco de dados.',category:'Desenvolvimento de Sistemas',image:'',created_at:'2026-10-07T12:00:00Z'},
{id:'demo-3',title:'Processos simples, resultados melhores',summary:'A melhoria contínua começa ao compreender o trabalho real e eliminar etapas que não agregam valor.',content:'Este é um artigo de demonstração sobre organização empresarial. Publique seus textos na área reservada do autor.',category:'Organização Empresarial',image:'',created_at:'2026-10-06T12:00:00Z'}];
let articles=[], comments=[], currentPage='home', selectedArticle=null, activeCategory='', searchTerm='', isAdmin=false, adminSection='articles', currentStars=0;
const main=document.getElementById('main'); const nav=document.getElementById('nav');
const configured=()=>SUPABASE_URL.startsWith('https://') && SUPABASE_URL.includes('.supabase.co') && SUPABASE_ANON_KEY.startsWith('sb_publishable_') && !SUPABASE_ANON_KEY.includes('COLE_AQUI');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg,error=false){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');t.classList.toggle('error',error);setTimeout(()=>t.classList.add('hidden'),3800)}
function dateFmt(s){try{return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(s))}catch{return ''}}
function bodyHtml(s=''){return esc(s).split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
function imageHtml(url,cls='cover'){return url?`<img class="${cls}" src="${esc(url)}" alt="Imagem do artigo" loading="lazy" onerror="this.onerror=null;this.outerHTML='<div class=cover cover-placeholder></div>'">`:`<div class="cover cover-placeholder" aria-label="Artigo sem imagem"></div>`}
async function api(path,options={}){if(!configured())throw new Error('Configure primeiro a URL e a chave pública do Supabase no index.html.');const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw new Error((await r.text()).slice(0,300));return r.status===204?null:r.json()}
async function loadData(){if(!configured()){articles=DEMO;comments=[];render();return}try{articles=await api('articles?select=*&published=eq.true&order=created_at.desc');comments=await api('comments?select=*&approved=eq.true&order=created_at.asc');render()}catch(e){articles=DEMO;comments=[];render();toast('Não foi possível carregar o Supabase. Verifique a configuração.',true)}}
function setPage(p){currentPage=p;selectedArticle=null;activeCategory='';nav.querySelectorAll('button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));nav.classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});document.getElementById('mobileMenu').onclick=()=>nav.classList.toggle('open');document.getElementById('year').textContent=new Date().getFullYear();
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();searchTerm=document.getElementById('searchInput').value.trim();currentPage='home';selectedArticle=null;render();});document.getElementById('openLogin').onclick=()=>showLogin();
function renderCats(){const cats=document.getElementById('sideCats');if(!cats)return;cats.innerHTML=CATEGORIES.map(c=>`<button data-cat="${esc(c)}">${esc(c)} <span>›</span></button>`).join('');cats.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;currentPage='categorias';selectedArticle=null;render();window.scrollTo({top:0,behavior:'smooth'})})}
function heading(kicker,title,sub=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div></div>`}
function cards(list){if(!list.length)return '<div class="empty">Nenhum artigo encontrado. Tente outra pesquisa ou categoria.</div>';return `<div class="article-grid">${list.map(a=>`<article class="article-card" tabindex="0" role="button" data-article="${esc(a.id)}" aria-label="Abrir artigo ${esc(a.title)}">${imageHtml(a.image)}<div class="article-copy"><span class="pill">${esc(a.category)}</span><h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p><div class="meta">${dateFmt(a.created_at)} · Ler artigo ↗</div></div></article>`).join('')}</div>`}
function wireCards(){main.querySelectorAll('[data-article]').forEach(el=>{const go=()=>openArticle(el.dataset.article);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}})}
function renderHome(){let list=articles.filter(a=>(!activeCategory||a.category===activeCategory)&&(!searchTerm||[a.title,a.summary,a.content,a.category].join(' ').toLowerCase().includes(searchTerm.toLowerCase())));main.innerHTML=cards(list);wireCards()}
function renderCategories(){main.innerHTML=heading('EXPLORE POR TEMA','Categorias','Escolha um assunto para encontrar todos os artigos relacionados.')+`<div class="creation-grid">${CATEGORIES.map((c,i)=>`<button class="creation" data-select-cat="${esc(c)}" style="text-align:left;color:inherit;cursor:pointer"><div class="eyebrow">TEMA 0${i+1}</div><h3>${esc(c)}</h3><p>${articles.filter(a=>a.category===c).length} artigo(s) · Ver publicações →</p></button>`).join('')}</div>`+(activeCategory?`<div style="margin-top:28px">${heading('PUBLICAÇÕES',esc(activeCategory))}${cards(articles.filter(a=>a.category===activeCategory))}</div>`:'');main.querySelectorAll('[data-select-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.selectCat;renderCategories()});wireCards()}
function renderAbout(){const story=localStorage.getItem('site_story')||'Esta é a sua área de história. Faça login como autor para escrever sua trajetória, experiências, aprendizados e objetivos.';const creations=JSON.parse(localStorage.getItem('site_creations')||'[]');main.innerHTML=heading('TRAJETÓRIA E CRIAÇÕES','Sobre mim','Minha jornada, minhas ideias e o que estou construindo.')+`<section class="section-panel"><h2>Minha história</h2><div class="story">${esc(story)}</div><h2 style="margin-top:28px">Minhas criações</h2><div class="creation-grid">${(creations.length?creations:[{title:'Projetos e sistemas',description:'Soluções digitais pensadas para desafios reais.'},{title:'Melhoria de processos',description:'Organização, controle e evolução da operação.'}]).map(c=>`<div class="creation"><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p>${c.url?`<p><a target="_blank" rel="noopener" href="${esc(c.url)}">Conhecer projeto ↗</a></p>`:''}</div>`).join('')}</div></section>`}
function renderContact(){main.innerHTML=heading('VAMOS CONVERSAR','Entre em contato','Tem uma ideia, uma dúvida ou uma oportunidade? Envie uma mensagem.')+`<section class="section-panel"><form id="contactForm" class="form-grid"><div class="form-field"><label for="contactName">Seu nome *</label><input class="field" id="contactName" required maxlength="100"></div><div class="form-field"><label for="contactEmail">Seu e-mail *</label><input class="field" id="contactEmail" type="email" required maxlength="200"></div><div class="form-field"><label for="contactPhone">WhatsApp (opcional)</label><input class="field" id="contactPhone" maxlength="30"></div><div class="form-field"><label for="contactSubject">Assunto *</label><input class="field" id="contactSubject" required maxlength="160"></div><div class="form-field full"><label for="contactMessage">Sua mensagem *</label><textarea id="contactMessage" required maxlength="5000"></textarea></div><div class="form-field full"><button class="btn">Enviar mensagem</button></div></form><div class="contact-cards"><div class="contact-card"><strong>Contato profissional</strong><span>Use o formulário para falar comigo.</span></div><div class="contact-card"><strong>Projetos e parcerias</strong><span>Conte brevemente como posso ajudar.</span></div></div><div style="margin-top:28px;padding-top:18px;border-top:1px solid #444"><h2>Acesso do autor</h2><p class="meta">Área reservada para editar textos e publicar artigos.</p><button class="btn secondary" id="openLoginContact" type="button">Entrar com senha</button></div></section>`;document.getElementById('contactForm').onsubmit=submitContact;document.getElementById('openLoginContact').onclick=showLogin}
async function submitContact(e){e.preventDefault();const payload={name:document.getElementById('contactName').value.trim(),email:document.getElementById('contactEmail').value.trim(),phone:document.getElementById('contactPhone').value.trim(),subject:document.getElementById('contactSubject').value.trim(),message:document.getElementById('contactMessage').value.trim()};if(!configured()){const arr=JSON.parse(localStorage.getItem('demo_messages')||'[]');arr.push({...payload,created_at:new Date().toISOString()});localStorage.setItem('demo_messages',JSON.stringify(arr));e.target.reset();toast('Mensagem salva neste navegador (modo demonstração).');return}try{await api('contact_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});e.target.reset();toast('Mensagem enviada. Obrigado pelo contato!')}catch(err){toast('Não foi possível enviar: '+err.message,true)}}
function openArticle(id){selectedArticle=articles.find(a=>a.id===id);if(!selectedArticle)return;renderArticle();window.scrollTo({top:0,behavior:'smooth'})}
function renderArticle(){const a=selectedArticle;const ownComments=comments.filter(c=>c.article_id===a.id);main.innerHTML=`<button class="btn secondary back" id="backArticles">← Voltar aos artigos</button><article class="article-full"><span class="pill">${esc(a.category)}</span><h1>${esc(a.title)}</h1><div class="meta">Publicado em ${dateFmt(a.created_at)}</div>${a.image?`<img class="article-hero" src="${esc(a.image)}" alt="Imagem do artigo">`:''}<div class="article-body">${bodyHtml(a.content)}</div><div class="comments"><h2>O que você achou deste artigo?</h2><p style="color:var(--muted);font-size:13px">Deixe sua opinião e avalie de 1 a 5 estrelas.</p><form id="commentForm"><div class="form-grid"><div class="form-field"><label for="commentName">Seu nome *</label><input id="commentName" class="field" required maxlength="80"></div><div class="form-field"><label>Sua avaliação *</label><div class="stars" id="starPicker" aria-label="Escolher avaliação">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" aria-label="${n} estrelas">★</button>`).join('')}</div></div><div class="form-field full"><label for="commentText">Comentário *</label><textarea id="commentText" required maxlength="2000" placeholder="Compartilhe o que você achou..."></textarea></div><div class="form-field full"><button class="btn">Publicar comentário</button></div></div></form><div id="commentsList">${ownComments.length?ownComments.map(c=>`<div class="comment"><strong>${esc(c.name)} · <span style="color:#ffc857">${'★'.repeat(c.rating)}${'☆'.repeat(5-c.rating)}</span></strong><p>${esc(c.comment)}</p><div class="meta">${dateFmt(c.created_at)}</div></div>`).join(''):'<p style="color:var(--muted)">Ainda não há comentários. Seja o primeiro!</p>'}</div></div></article>`;document.getElementById('backArticles').onclick=()=>{selectedArticle=null;render()};currentStars=0;document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{currentStars=Number(b.dataset.star);document.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.star)<=currentStars))});document.getElementById('commentForm').onsubmit=submitComment}
async function submitComment(e){e.preventDefault();if(!currentStars){toast('Escolha uma quantidade de estrelas.',true);return}const a=selectedArticle;const payload={article_id:a.id,name:document.getElementById('commentName').value.trim(),comment:document.getElementById('commentText').value.trim(),rating:currentStars};if(String(a.id).startsWith('demo-')||!configured()){const item={...payload,id:'local-'+Date.now(),created_at:new Date().toISOString()};comments.push(item);const all=JSON.parse(localStorage.getItem('demo_comments')||'[]');all.push(item);localStorage.setItem('demo_comments',JSON.stringify(all));toast('Comentário salvo neste navegador (modo demonstração).');renderArticle();return}try{await api('comments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});comments=await api('comments?select=*&approved=eq.true&order=created_at.asc');toast('Comentário publicado!');renderArticle()}catch(err){toast('Não foi possível publicar o comentário: '+err.message,true)}}
function render(){if(selectedArticle){renderArticle();return}if(currentPage==='home')renderHome();else if(currentPage==='categorias')renderCategories();else if(currentPage==='sobre')renderAbout();else if(currentPage==='contato')renderContact();else if(currentPage==='admin')renderAdmin();renderCats()}
function showLogin(){main.innerHTML=heading('ÁREA RESTRITA','Acesso do autor','Somente o responsável pelo site pode editar e publicar conteúdo.')+`<section class="section-panel" style="max-width:540px"><form id="loginForm" class="form-grid"><div class="form-field full"><label for="adminPassword">Senha de acesso</label><input class="field" type="password" id="adminPassword" autocomplete="current-password" required></div><div class="form-field full"><button class="btn">Entrar na área do autor</button><button class="btn secondary" type="button" id="cancelLogin">Cancelar</button></div></form><p class="meta">A senha não é armazenada no HTML. Para habilitar a área administrativa, configure a função segura no Supabase.</p></section>`;document.getElementById('cancelLogin').onclick=()=>setPage('home');document.getElementById('loginForm').onsubmit=login}
async function login(e){e.preventDefault();const password=document.getElementById('adminPassword').value;if(!configured()){toast('Falta configurar a chave pública do Supabase no início do arquivo index.html.',true);return}try{const r=await fetch(ADMIN_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify({action:'login',password})});const data=await r.json();if(!r.ok||!data.token)throw new Error(data.error||'Senha inválida.');sessionStorage.setItem('site_admin_token',data.token);isAdmin=true;currentPage='admin';selectedArticle=null;render();toast('Acesso autorizado.')}catch(err){toast(err.message||'Falha no login.',true)}}
async function adminCall(action,payload={}){const token=sessionStorage.getItem('site_admin_token');const r=await fetch(ADMIN_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+(token||'')},body:JSON.stringify({action,...payload})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Operação não concluída.');return data}
function renderAdmin(){if(!isAdmin||!sessionStorage.getItem('site_admin_token')){showLogin();return}main.innerHTML=heading('PAINEL PRIVADO','Área do autor','Gerencie artigos, história e criações do site.')+`<div class="admin-tabs"><button data-admin="articles" class="${adminSection==='articles'?'active':''}">Artigos</button><button data-admin="story" class="${adminSection==='story'?'active':''}">Minha história</button><button data-admin="creations" class="${adminSection==='creations'?'active':''}">Minhas criações</button><button id="logoutBtn">Sair</button></div><div id="adminContent"></div>`;main.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{adminSection=b.dataset.admin;renderAdmin()});document.getElementById('logoutBtn').onclick=()=>{sessionStorage.removeItem('site_admin_token');isAdmin=false;setPage('home')};if(adminSection==='articles')renderAdminArticles();else if(adminSection==='story')renderAdminStory();else renderAdminCreations()}
function renderAdminArticles(){const c=document.getElementById('adminContent');c.innerHTML=`<section class="admin-box"><h2 id="articleFormTitle">Publicar artigo</h2><form id="adminArticleForm" class="form-grid"><input type="hidden" id="editId"><div class="form-field full"><label>Título *</label><input class="field" id="aTitle" maxlength="180" required></div><div class="form-field full"><label>Resumo breve *</label><textarea id="aSummary" required maxlength="500"></textarea></div><div class="form-field full"><label>Texto completo * (parágrafos separados por linha em branco)</label><textarea id="aContent" required style="min-height:220px"></textarea></div><div class="form-field"><label>Categoria *</label><select id="aCategory" required>${CATEGORIES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="form-field"><label>Imagem (URL pública)</label><input class="field" id="aImage" type="url" placeholder="https://..."></div><div class="form-field full"><label><input id="aPublished" type="checkbox" checked> Publicar no site</label></div><div class="form-field full"><button class="btn">Salvar artigo</button><button class="btn secondary" type="button" id="clearArticle">Limpar formulário</button></div></form></section><section class="admin-box"><h2>Artigos cadastrados</h2><div id="adminArticleList">Carregando...</div></section>`;document.getElementById('adminArticleForm').onsubmit=saveArticle;document.getElementById('clearArticle').onclick=clearArticleForm;loadAdminArticles()}
async function loadAdminArticles(){try{const data=await adminCall('list_articles');const el=document.getElementById('adminArticleList');if(!el)return;el.innerHTML=data.articles.length?data.articles.map(a=>`<div class="admin-item"><div><strong>${esc(a.title)}</strong><small>${esc(a.category)} · ${a.published?'Publicado':'Rascunho'}</small></div><div class="article-actions"><button class="btn secondary small" data-edit="${esc(a.id)}">Editar</button><button class="btn danger small" data-delete="${esc(a.id)}">Excluir</button></div></div>`).join(''):'<p class="meta">Nenhum artigo cadastrado.</p>';el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editArticle(data.articles.find(a=>a.id===b.dataset.edit)));el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteArticle(b.dataset.delete))}catch(e){const el=document.getElementById('adminArticleList');if(el)el.innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
function clearArticleForm(){document.getElementById('adminArticleForm').reset();document.getElementById('editId').value='';document.getElementById('articleFormTitle').textContent='Publicar artigo'}function editArticle(a){document.getElementById('editId').value=a.id;document.getElementById('aTitle').value=a.title;document.getElementById('aSummary').value=a.summary;document.getElementById('aContent').value=a.content;document.getElementById('aCategory').value=a.category;document.getElementById('aImage').value=a.image||'';document.getElementById('aPublished').checked=a.published;document.getElementById('articleFormTitle').textContent='Editar artigo';document.getElementById('aTitle').scrollIntoView({behavior:'smooth',block:'center'})}
async function saveArticle(e){e.preventDefault();const payload={id:document.getElementById('editId').value||null,title:document.getElementById('aTitle').value.trim(),summary:document.getElementById('aSummary').value.trim(),content:document.getElementById('aContent').value.trim(),category:document.getElementById('aCategory').value,image:document.getElementById('aImage').value.trim()||null,published:document.getElementById('aPublished').checked};try{await adminCall('save_article',{article:payload});toast('Artigo salvo com sucesso.');clearArticleForm();await loadAdminArticles();await loadData()}catch(err){toast(err.message,true)}}async function deleteArticle(id){if(!confirm('Excluir este artigo permanentemente?'))return;try{await adminCall('delete_article',{id});toast('Artigo excluído.');await loadAdminArticles();await loadData()}catch(e){toast(e.message,true)}}
function renderAdminStory(){const c=document.getElementById('adminContent');const story=localStorage.getItem('site_story')||'';c.innerHTML=`<section class="admin-box"><h2>Minha história</h2><p class="meta">O texto fica neste navegador. Para publicação global, configure as tabelas opcionais indicadas no SQL.</p><form id="storyForm"><div class="form-field"><label>Conte sua trajetória</label><textarea id="storyText" style="min-height:260px">${esc(story)}</textarea></div><button class="btn" style="margin-top:12px">Salvar história</button></form></section>`;document.getElementById('storyForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('site_story',document.getElementById('storyText').value);toast('História salva neste navegador.');}}
function renderAdminCreations(){const c=document.getElementById('adminContent');const arr=JSON.parse(localStorage.getItem('site_creations')||'[]');c.innerHTML=`<section class="admin-box"><h2>Minhas criações</h2><form id="creationForm" class="form-grid"><div class="form-field"><label>Nome do projeto</label><input class="field" id="crTitle" required maxlength="100"></div><div class="form-field"><label>Link (opcional)</label><input class="field" id="crUrl" type="url" placeholder="https://..."></div><div class="form-field full"><label>Descrição</label><textarea id="crDesc" required maxlength="500"></textarea></div><div class="form-field full"><button class="btn">Adicionar criação</button></div></form><div class="admin-list">${arr.map((x,i)=>`<div class="admin-item"><div><strong>${esc(x.title)}</strong><small>${esc(x.description)}</small></div><button class="btn danger small" data-remove-creation="${i}">Excluir</button></div>`).join('')}</div></section>`;document.getElementById('creationForm').onsubmit=e=>{e.preventDefault();arr.push({title:document.getElementById('crTitle').value.trim(),url:document.getElementById('crUrl').value.trim(),description:document.getElementById('crDesc').value.trim()});localStorage.setItem('site_creations',JSON.stringify(arr));renderAdminCreations();toast('Criação salva neste navegador.')};c.querySelectorAll('[data-remove-creation]').forEach(b=>b.onclick=()=>{arr.splice(Number(b.dataset.removeCreation),1);localStorage.setItem('site_creations',JSON.stringify(arr));renderAdminCreations()})}
loadData();
</script></body></html>
